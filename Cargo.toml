[package]
name = "autorpg-mcp"
version = "0.1.0"
edition = "2024"

[features]
# default = ["input-simulator"]
input-simulator = ["dep:input-simulator"]

[dependencies]
# Official Model Context Protocol SDK for Rust
# "transport-io" enables the stdio() transport used by the server
rmcp = { version = "3.2", features = ["server", "transport-io"] }
# Only the pieces used directly: `#[tokio::main]`/`tokio::pin!` (macros),
# the multi-threaded runtime and `spawn_blocking` (rt-multi-thread, which implies rt),
# `RwLock`/`Notify` (sync) and `sleep`/`Instant`/`timeout_at` (time).
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# TOML configuration file parsing
toml = "0.9"
image = { version = "0.25", features = ["jpeg", "png"] }
base64 = "0.22"

# SIMD-accelerated image resampling (used to downscale captured frames).
# Default features only; `rayon` is deliberately off so idle frames do not keep a thread pool warm.
fast_image_resize = "6.1"

# Low-overhead safe DirectX Windows graphics capturing API
windows-capture = "2.0"

# Logging facade; the capture thread reports transient frame errors through it.
log = "0.4"

# Logger backend for the `log` facade. Writes to stderr, because stdout carries the
# JSON-RPC stream. Level is controlled by the RUST_LOG environment variable.
env_logger = "0.11"

# Cross-platform keyboard & mouse input simulation (WASD movement, mouse control)
enigo = "0.6"

# RNG for the WindMouse cursor-path simulation (jittered step forces and timing)
rand = "0.9"

input-simulator = { git = "https://github.com/artwend/input-simulator", optional = true }

# The capture thread runs a tight per-frame loop (staging map, downsample, pixel
# repack) on every compositor update. An unoptimized build executes that loop
# roughly 50x slower and pins a core, so the binary the MCP client launches must
# always be the release build. These settings widen cross-crate inlining into the
# capture pipeline, which is where the remaining per-frame cost lives.
[profile.release]
codegen-units = 1
lto = true

# Profiling build (`cargo build --profile profiling`, driven by scripts/profile.ps1):
# release semantics plus full debug info so samply can resolve Rust frames to
# functions and lines. Thin LTO instead of fat LTO because fat LTO drops frames
# into LLVM-generated code with poorer attribution, and the extra build time is
# paid on every profiling iteration.
[profile.profiling]
inherits = "release"
debug = 2
lto = "thin"
